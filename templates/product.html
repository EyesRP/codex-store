<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} - متجر كودكس</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-store"></i> Codex <span>Store</span>
        </div>
        <nav>
            <a href="/">الرئيسية</a>
        </nav>
    </header>

    <section class="products-section" style="min-height: 70vh; display: flex; align-items: center; justify-content: center;">
        <div style="background: #151821; border: 1px solid #222634; padding: 40px; border-radius: 12px; max-width: 600px; width: 100%;">
            <span class="product-badge" style="position: static; display: inline-block; margin-bottom: 15px;">{{ product.category }}</span>
            <h1 style="color: #fff; font-size: 28px; margin-bottom: 15px;">{{ product.name }}</h1>
            <p style="color: #94a3b8; font-size: 16px; line-height: 1.6; margin-bottom: 25px;">{{ product.description }}</p>
            
            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #222634; pt-4; padding-top: 20px;">
                <span class="price" style="font-size: 24px;">السعر: {{ product.price }}$</span>
                <button class="btn-main" onclick="alert('تمت الإضافة إلى السلة بنجاح!')">إتمام الشراء</button>
            </div>
            
            <div style="margin-top: 20px; text-align: center;">
                <a href="/" style="color: #6366f1; text-decoration: none; font-weight: 600;"><i class="fa-solid fa-arrow-right"></i> العودة للرئيسية</a>
            </div>
        </div>
    </section>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 - Codex Store</p>
    </footer>

</body>
</html>
