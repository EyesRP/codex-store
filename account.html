<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حسابي - Codex Store</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-container {
            max-width: 500px;
            margin: 60px auto;
            background: #12141d;
            border: 1px solid #1f2430;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .tab-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #1a1d29;
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 30px;
        }
        .tab-btn {
            background: none;
            border: none;
            color: #94a3b8;
            padding: 12px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: #8b5cf6;
            color: white;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .form-control {
            width: 100%;
            background: #1a1d29;
            border: 1px solid #2d3748;
            color: #fff;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 14px;
            transition: 0.3s;
        }
        .form-control:focus {
            border-color: #8b5cf6;
            outline: none;
            box-shadow: 0 0 8px rgba(139, 92, 246, 0.3);
        }
        .phone-input-group {
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 10px;
        }
        .submit-btn {
            width: 100%;
            background: #8b5cf6;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background: #7c3aed;
        }
        .discord-btn {
            width: 100%;
            background: #5865F2;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            transition: 0.3s;
        }
        .discord-btn:hover {
            background: #4752c4;
        }
        .divider {
            text-align: center;
            border-bottom: 1px solid #1f2430;
            line-height: 0.1em;
            margin: 25px 0;
            color: #94a3b8;
            font-size: 13px;
        }
        .divider span {
            background: #12141d;
            padding: 0 15px;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo" style="cursor: pointer;" onclick="window.location.href='/'">
            <i class="fa-solid fa-store"></i> Codex <span>Store</span>
        </div>
        <nav>
            <a href="/">الرئيسية</a>
        </nav>
    </header>

    <div class="auth-container">
        <!-- أزرار التبديل بين تسجيل الدخول وإنشاء حساب -->
        <div class="tab-buttons">
            <button id="registerTabBtn" class="tab-btn active" onclick="switchTab('register')">إنشاء حساب</button>
            <button id="loginTabBtn" class="tab-btn" onclick="switchTab('login')">تسجيل الدخول</button>
        </div>

        <!-- نموذج إنشاء حساب -->
        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group" id="nameFieldGroup">
                <label>الاسم الكريم</label>
                <input type="text" id="regName" class="form-control" placeholder="أدخل الاسم الكريم">
            </div>

            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="regEmail" class="form-control" placeholder="أدخل البريد الإلكتروني" required>
            </div>

            <div class="form-group" id="phoneFieldGroup">
                <label>رقم الجوال</label>
                <div class="phone-input-group">
                    <select class="form-control" style="background: #1a1d29; color: #fff;">
                        <option value="+966">SA +966</option>
                        <option value="+971">AE +971</option>
                        <option value="+973">BH +973</option>
                    </select>
                    <input type="tel" id="regPhone" class="form-control" placeholder="أدخل رقم الجوال">
                </div>
            </div>

            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="regPassword" class="form-control" placeholder="أدخل كلمة المرور" required>
            </div>

            <button type="submit" class="submit-btn" id="submitBtnText">إنشاء حساب</button>
        </form>

        <div class="divider"><span>أو</span></div>

        <!-- زر تسجيل الدخول عبر Discord -->
        <button onclick="loginWithDiscord()" class="discord-btn">
            <i class="fa-brands fa-discord" style="font-size: 20px;"></i> المتابعة بواسطة Discord
        </button>
    </div>

    <!-- الإشعار المنبثق -->
    <div id="modern-toast" style="position: fixed; bottom: -100px; right: 30px; background: #12141d; color: #fff; padding: 16px 24px; border-radius: 14px; border: 1px solid #8b5cf6; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 14px; z-index: 99999; transition: bottom 0.4s ease;">
        <i class="fa-solid fa-circle-check" style="color: #10b981; font-size: 22px;"></i>
        <div>
            <div style="font-weight: bold; font-size: 14px;" id="toast-title">إشعار</div>
            <div id="toast-desc" style="font-size: 12px; color: #94a3b8; margin-top: 2px;">تم بنجاح</div>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 - Codex Store</p>
    </footer>

    <script>
        let isLoginMode = false;

        function switchTab(mode) {
            isLoginMode = (mode === 'login');
            let regBtn = document.getElementById('registerTabBtn');
            let logBtn = document.getElementById('loginTabBtn');
            let nameGroup = document.getElementById('nameFieldGroup');
            let phoneGroup = document.getElementById('phoneFieldGroup');
            let submitBtn = document.getElementById('submitBtnText');

            if (isLoginMode) {
                logBtn.classList.add('active');
                regBtn.classList.remove('active');
                nameGroup.style.display = 'none';
                phoneGroup.style.display = 'none';
                submitBtn.innerText = 'تسجيل الدخول';
            } else {
                regBtn.classList.add('active');
                logBtn.classList.remove('active');
                nameGroup.style.display = 'block';
                phoneGroup.style.display = 'block';
                submitBtn.innerText = 'إنشاء حساب';
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            let email = isLoginMode ? document.getElementById('regEmail').value : document.getElementById('regEmail').value;
            let password = document.getElementById('regPassword').value;

            if (isLoginMode) {
                // عملية تسجيل الدخول
                let savedUser = JSON.parse(localStorage.getItem('codex_user'));
                if (savedUser && savedUser.email === email && savedUser.password === password) {
                    showToast("مرحباً بعودتك", `أهلاً بك يا ${savedUser.name || 'عميلنا العزيز'}`);
                    setTimeout(() => { window.location.href = '/'; }, 1500);
                } else {
                    showToast("خطأ في البيانات", "البريد الإلكتروني أو كلمة المرور غير صحيحة!", "#ef4444");
                }
            } else {
                // عملية إنشاء الحساب وحفظ البيانات
                let name = document.getElementById('regName').value;
                let phone = document.getElementById('regPhone').value;
                
                let userData = { name, email, phone, password };
                localStorage.setItem('codex_user', JSON.stringify(userData));
                
                showToast("تم إنشاء الحساب", "تم حفظ معلوماتك بنجاح وأهلاً بك في Codex Store");
                setTimeout(() => { window.location.href = '/'; }, 1500);
            }
        }

        function loginWithDiscord() {
            showToast("Discord Auth", "جاري توجيهك للمصادقة عبر Discord...");
            setTimeout(() => {
                window.location.href = "https://discord.com/login";
            }, 1200);
        }

        function showToast(title, desc, color = "#10b981") {
            let toast = document.getElementById('modern-toast');
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-desc').innerText = desc;
            toast.style.borderColor = color;

            toast.style.bottom = '30px';
            setTimeout(() => {
                toast.style.bottom = '-100px';
            }, 3500);
        }
    </script>
</body>
</html>
